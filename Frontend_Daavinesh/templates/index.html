<!DOCTYPE html>
<html>
<head><title>EcoLoop MMU</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body>
    <nav>
        <div class="logo" onclick="location.href='/'">Eco<span>Loop</span></div>
        <button class="primary" onclick="location.href='/login'">Login</button>
    </nav>
    <section class="hero">
        <h1 style="color: var(--mmu-blue);">FCI Resource Exchange</h1>
        <div style="max-width: 500px; margin: 20px auto; display: flex; border: 2px solid var(--mmu-blue); border-radius: 5px; overflow: hidden;">
            <form action="/search" method="get" style="display: flex; width: 100%;">
                <input type="text" name="query" placeholder="Search textbooks, kits..." style="border:none;">
                <button type="submit" class="primary" style="border-radius:0;">Search</button>
            </form>
        </div>
        <div style="margin-top: 40px; display: flex; justify-content: center; gap: 60px;">
            <div><h2 style="color:var(--mmu-red); font-size: 40px; margin:0;">{{ impact.total_items_reused }}</h2><p>Items Reused</p></div>
            <div><h2 style="color:var(--mmu-blue); font-size: 40px; margin:0;">{{ impact.co2_offset_kg }}kg</h2><p>CO2 Saved</p></div>
        </div>
    </section>
</body>
</html>
