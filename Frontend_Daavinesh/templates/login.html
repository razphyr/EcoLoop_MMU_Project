<!DOCTYPE html>
<html>
<head>
    <title>Login | EcoLoop MMU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #f4f4f9;">

    <nav style="background: #004892; padding: 15px 5%; color: white; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo" style="font-size: 24px; font-weight: 800; cursor: pointer;" onclick="window.location.href='/'">Eco<span style="color: #e11b22;">Loop</span></div>
        <div style="font-size: 14px; font-weight: 600;">MULTIMEDIA UNIVERSITY</div>
    </nav>

    <div style="display: flex; justify-content: center; padding: 80px 20px;">
        <div class="card" style="width: 350px; background: white; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #004892; text-align: center;">
            <h2 style="color: #004892; margin-top: 0; font-size: 28px;">Sign In</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Already have an account? Log in here.</p>
            
            <form id="signInForm" style="display: flex; flex-direction: column; gap: 18px;">
                <input type="email" id="loginEmail" placeholder="MMU Email" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; width: 100%; box-sizing: border-box;">
                <input type="password" id="loginPassword" placeholder="Password" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; width: 100%; box-sizing: border-box;">
                <button type="submit" style="background: #e11b22; color: white; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%;">Enter Marketplace</button>
            </form>
            
            <p style="margin-top: 25px; font-size: 14px; color: #666;">
                New? <a href="/register" style="color: #e11b22; font-weight: bold; text-decoration: none;">Register here</a>
            </p>
            
            <p id="loginMessage" style="font-weight: bold; margin-top: 15px; color: #e11b22;"></p>
        </div>
    </div>

    <script>
        document.getElementById('signInForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('http://127.0.0.1:5000/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('username', data.user.name);
                window.location.href = '/main';
            } else {
                document.getElementById('loginMessage').innerText = data.error;
            }
        };
    </script>
</body>
</html>
