<!DOCTYPE html>
<html>
<head><title>Login | EcoLoop</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body>
    <nav><div class="logo" onclick="location.href='/'">Eco<span>Loop</span></div></nav>
    <div style="display:flex; justify-content:center; margin-top:80px;">
        <div class="card" style="width:350px; text-align:center;">
            <h2 style="color:var(--mmu-blue);">Student Sign In</h2>
            <form id="lForm" style="display:flex; flex-direction:column; gap:15px; margin-bottom: 20px;">
                <input type="email" id="e" placeholder="MMU Email" required>
                <input type="password" id="p" placeholder="Password" required>
                <button type="submit" class="btn-mmu">Enter Marketplace</button>
            </form>
            <p>New here? <a href="/register" style="color:var(--mmu-red); font-weight:bold; text-decoration:none;">Sign Up</a></p>
            <p id="m" style="font-weight:bold;"></p>
        </div>
    </div>
    <script>
        document.getElementById('lForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('http://127.0.0.1:5000/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: document.getElementById('e').value, password: document.getElementById('p').value})
            });
            const data = await res.json();
            if (res.ok) location.href = '/';
            else {
                const m = document.getElementById('m');
                m.style.color = "var(--mmu-red)";
                m.innerText = data.error;
            }
        };
    </script>
</body>
</html>
