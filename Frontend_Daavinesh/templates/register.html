<!DOCTYPE html>
<html>
<head><title>Sign Up | EcoLoop</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body>
    <nav><div class="logo" onclick="location.href='/'">Eco<span>Loop</span></div></nav>
    <div style="display:flex; justify-content:center; margin-top:50px;">
        <div class="card" style="width:350px; text-align:center;">
            <h2 style="color:var(--mmu-blue);">Join EcoLoop</h2>
            <form id="rForm" style="display:flex; flex-direction:column; gap:15px; margin-bottom: 20px;">
                <input type="text" id="n" placeholder="Full Name" required>
                <input type="email" id="e" placeholder="MMU Student Email" required>
                <input type="password" id="p" placeholder="Password" required>
                <button type="submit" class="btn-mmu">Send 2FA Code</button>
            </form>
            <p>Already have an account? <a href="/login" style="color:var(--mmu-blue); font-weight:bold; text-decoration:none;">Sign In</a></p>
            <p id="m" style="font-weight:bold; color:var(--mmu-red);"></p>
        </div>
    </div>
    <script>
        document.getElementById('rForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('e').value;
            const res = await fetch('http://127.0.0.1:5000/api/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: document.getElementById('n').value, email: email, password: document.getElementById('p').value})
            });
            if (res.ok) location.href = `/verify?email=${email}`;
            else document.getElementById('m').innerText = (await res.json()).error;
        };
    </script>
</body>
</html>
