<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoLoop Student Marketplace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --eco-leaf:#3B6D11;--eco-leaf-light:#EAF3DE;--eco-leaf-mid:#639922;
  --eco-bark:#5F5E5A;--eco-cream:#F1EFE8;--eco-gold:#BA7517;
  --eco-gold-light:#FAEEDA;--eco-red:#A32D2D;--eco-red-light:#FCEBEB;
  --bg:#f5f5f3;--surface:#fff;--surface2:#f9f9f7;
  --text:#222;--text2:#888;--border:#e0e0e0;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);padding:1.5rem;min-height:100vh}
h1{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;color:var(--eco-leaf);letter-spacing:-0.5px;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--text2);margin-bottom:1.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{background:var(--surface);border:0.5px solid var(--border);border-radius:20px;padding:5px 14px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--text2)}
.filter-btn.active{background:var(--eco-leaf);color:#fff;border-color:var(--eco-leaf)}
.sell-btn{background:var(--eco-leaf);color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:var(--surface2);border-radius:10px;padding:.9rem 1rem}
.stat-val{font-size:22px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;overflow:hidden}
.card.is-sold{opacity:.5;pointer-events:none}
.card-img{width:100%;height:130px;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--eco-cream)}
.card-body{padding:12px}
.card-name{font-size:14px;font-weight:500}
.price{color:var(--eco-gold)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px}
.badge.available{background:var(--eco-leaf-light);color:var(--eco-leaf)}
.badge.sold{background:var(--eco-red-light);color:var(--eco-red)}
.buy-btn{font-size:12px;background:var(--eco-leaf-light);color:var(--eco-leaf);border:1px solid #97C459;border-radius:7px;padding:5px 12px;cursor:pointer}
.report-btn{font-size:12px;background:var(--eco-red-light);color:var(--eco-red);border:1px solid #e08080;border-radius:7px;padding:5px 12px;cursor:pointer}
.report-btn:hover{background:var(--eco-red);color:#fff}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:340px;max-width:94vw}
.field{margin-bottom:10px}
.field input,.field select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px}
</style>
</head>

<body>

<div class="topbar">
  <div>
    <h1>EcoLoop Market</h1>
    <p class="subtitle">Secondhand goods, first-rate value</p>
  </div>
  <button type="button" class="sell-btn" onclick="openModal()">+ Sell item</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="s-total"></div><div>Listings</div></div>
  <div class="stat"><div class="stat-val" id="s-avail"></div><div>Available</div></div>
  <div class="stat"><div class="stat-val" id="s-sold"></div><div>Sold</div></div>
</div>

<div class="filters">
  <button type="button" class="filter-btn active" onclick="setFilter('All',this)">All</button>
  <button type="button" class="filter-btn" onclick="setFilter('Available',this)">Available</button>
  <button type="button" class="filter-btn" onclick="setFilter('Sold',this)">Sold</button>
  <button type="button" class="filter-btn" onclick="setFilter('FCI',this)">FCI</button>
  <button type="button" class="filter-btn" onclick="setFilter('FOAIE',this)">FOAIE</button>
  <button type="button" class="filter-btn" onclick="setFilter('FCM',this)">FCM</button>
  <input type="text" id="searchBox" placeholder="Search item..." oninput="applyStudentFilters()">
  <input type="number" id="minPrice" placeholder="Min RM" oninput="applyStudentFilters()">
  <input type="number" id="maxPrice" placeholder="Max RM" oninput="applyStudentFilters()">
</div>

<div class="grid" id="grid"></div>

<!-- SELL MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>List item</h3>

    <div class="field"><input id="name" placeholder="Item name"></div>
    <div class="field"><input id="price" type="number" placeholder="Price"></div>
    <div class="field"><input id="student" placeholder="Student name"></div>
    <div class="field">
      <select id="faculty">
        <option>FCI</option>
        <option>FOAIE</option>
        <option>FCM</option>
      </select>
    </div>

    <button type="button" onclick="addItem()">Add</button>
    <button type="button" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- REPORT MODAL -->
<div class="overlay" id="reportOverlay">
  <div class="modal">
    <h3>Report Item</h3>

    <p id="reportItemInfo"></p>

    <div class="field">
      <select id="reportReason">
        <option value="Fake Item">Fake Item</option>
        <option value="Spam">Spam</option>
        <option value="Offensive Content">Offensive Content</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field">
      <input id="reportDetails" placeholder="Extra details (optional)">
    </div>

    <button type="button" onclick="submitReport()">Submit</button>
    <button type="button" onclick="closeReport()">Cancel</button>
  </div>
</div>

<script>

const EMOJI = { FCI:'💻', FOAIE:'📊', FCM:'🔬' };

let items = [];

let reportData = {
  item_id: null,
  item_name: "",
  student: ""
};

function openReport(id, name, student){
  reportData = { item_id: id, item_name: name, student: student };
  document.getElementById("reportItemInfo").textContent = `Item: ${name} | Seller: ${student}`;
  document.getElementById("reportOverlay").classList.add("open");
}

function closeReport(){
  document.getElementById("reportOverlay").classList.remove("open");
}

function submitReport(){
  const reason = document.getElementById("reportReason").value;
  const details = document.getElementById("reportDetails").value;

  fetch("http://127.0.0.1:5000/reports", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      item_id: reportData.item_id,
      item_name: reportData.item_name,
      student: reportData.student,
      reason: reason + (details ? ` - ${details}` : "")
    })
  })
  .then(res => res.json())
  .then(() => {
    alert("Report submitted");
    closeReport();
    document.getElementById("reportDetails").value = "";
  });
}

let studentFilter = { search: '', min: '', max: '' };

function applyStudentFilters() {
  studentFilter.search = document.getElementById('searchBox').value.toLowerCase();
  studentFilter.min = document.getElementById('minPrice').value;
  studentFilter.max = document.getElementById('maxPrice').value;
  render();
}

let activeFilter = 'All';

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const grid = document.getElementById('grid');

  const filtered = items.filter(it => {
    const okSearch = !studentFilter.search || it.name.toLowerCase().includes(studentFilter.search);
    const okMin = !studentFilter.min || it.price >= parseFloat(studentFilter.min);
    const okMax = !studentFilter.max || it.price <= parseFloat(studentFilter.max);
    const passBase =
      activeFilter === 'All' ||
      (activeFilter === 'Available' && !it.sold) ||
      (activeFilter === 'Sold' && it.sold) ||
      it.faculty === activeFilter;
    return passBase && okSearch && okMin && okMax;
  });

  grid.innerHTML = filtered.map(it => {
    // safely encode name/student to avoid apostrophe bugs
    const safeName    = encodeURIComponent(it.name);
    const safeStudent = encodeURIComponent(it.student);
    return `
    <div class="card ${it.sold ? 'is-sold' : ''}">
      <div class="card-img">${EMOJI[it.faculty]}</div>
      <div class="card-body">
        <div class="card-name">${it.name}</div>
        <div>${it.student} · ${it.faculty}</div>
        <div class="price">RM ${it.price}</div>
        <div class="badge ${it.sold ? 'sold' : 'available'}">${it.sold ? 'Sold' : 'Available'}</div>
        ${it.sold ? '' : `
          <button type="button" class="buy-btn" onclick="buy(${it.id})">Buy</button>
          <button type="button" class="report-btn" onclick="openReport(${it.id}, decodeURIComponent('${safeName}'), decodeURIComponent('${safeStudent}'))">Report</button>
        `}
      </div>
    </div>`;
  }).join('');

  updateStats();
}

function updateStats(){
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-avail').textContent = items.filter(i => !i.sold).length;
  document.getElementById('s-sold').textContent  = items.filter(i =>  i.sold).length;
}

function buy(id){
  fetch(`http://127.0.0.1:5000/items/${id}`, { method: "PUT" })
    .then(res => res.json())
    .then(updatedItem => {
      const index = items.findIndex(i => i.id === id);
      if(index !== -1){ items[index] = updatedItem; render(); }
    });
}

function openModal(){ document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

function addItem(){
  const name    = document.getElementById('name').value;
  const price   = document.getElementById('price').value;
  const student = document.getElementById('student').value;
  const faculty = document.getElementById('faculty').value;

  if(!name || !price || !student) return;

  fetch("http://127.0.0.1:5000/items", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, price: parseFloat(price), student, faculty })
  })
  .then(res => res.json())
  .then(data => { items.unshift(data); render(); closeModal(); });
}

fetch("http://127.0.0.1:5000/items")
  .then(res => res.json())
  .then(data => { items = data; render(); });

</script>

</body>
</html>
