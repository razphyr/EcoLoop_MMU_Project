<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eco Loop</title>
    <link href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <h2 class="logo">EcoLoop</h2>
    <ul>
        <li>Home</li>
        <li>Explore</li>
        <li>Transactions</li>
        <li>About us</li>
    </ul>
    <div class="nav-buttons"></div>
</nav>

<section class="hero">
    
    <div style="text-align: center; margin-bottom: 2.5rem; max-width: 750px; margin-left: auto; margin-right: auto; padding: 1rem 0;">
        
        <h1 class="logo" style="font-size: 5rem; margin-bottom: 1.2rem; letter-spacing: -1px;">EcoLoop</h1>
        
        <p style="color: #00ff88; font-family: 'Phudu', sans-serif; font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1.5rem; text-shadow: 0 0 20px rgba(0, 255, 136, 0.2); white-space: nowrap;">The future of student marketplace starts here</p>
        
        <div style="width: 60px; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); margin: 0 auto 1.5rem auto;"></div>

        <p style="color: rgba(255, 255, 255, 0.85); font-size: 1.15rem; font-weight: 400; line-height: 1.6; max-width: 650px; margin: 0 auto;">
            EcoLoop helps students to buy and sell their used items easily, save money, and reduce waste within our beloved campus communities.
        </p>
    </div>

    <div class="search-container">
        <form action="/search" method="get" style="display: flex; width: 100%; align-items: center;">
            <input type="text" name="query" placeholder="Search for items...">
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="yourjourney-buttons">
        <button class="primary">Start for free</button>
        <button class="secondary">Explore</button>
    </div>

</section>

</body>
</html>
