<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Loop // FCI Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="status-node">
            <span class="status-dot"></span>
            <span class="status-text">NODE // FCI_LIVE</span>
        </div>
        
        <ul>
            <li onclick="window.location.href='/'" style="cursor:pointer">Home</li>
            <li onclick="window.location.href='/login'" style="cursor:pointer">Explore</li>
            <li onclick="window.location.href='/login'" style="cursor:pointer">Dashboard</li>
        </ul>
        <div class="nav-buttons"></div>
    </nav>

    <section class="hero">
        <h1 class="main-title">EcoLoop</h1>
        <h2 class="subtitle">THE FCI COMPUTING MARKETPLACE HUB</h2>
        
        <p class="description">
            EcoLoop helps FCI students and staff trade programming manuals, computing hardware, <br>
            and course reference guides easily to reduce waste within our faculty community.
        </p>

        <div class="search-container">
            <form action="/search" method="get" onsubmit="return handleSearch(event)">
                <input type="text" name="query" placeholder="Search textbooks, lab kits, electronics..." required>
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="action-container">
            <button class="btn-start-now" onclick="window.location.href='/login'">Start Now</button>
        </div>
    </section>

    <script>
    function handleSearch(event) {
        // Inspects local storage vectors for an active authentication session status
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        
        if (!isLoggedIn) {
            // Block the form from redirecting to /search
            event.preventDefault(); 
            
            alert("Access Denied! You must be registered and logged in to search the FCI marketplace repository.");
            // Route the unauthorized guest user directly into your login matrix layout
            window.location.href = '/login';
            return false;
        }
        return true; // Let the form submit cleanly to /search if logged in
    }
    </script>

</body>
</html>
