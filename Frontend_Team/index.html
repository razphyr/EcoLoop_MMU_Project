<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="status-node">
            <span class="status-dot"></span>
            <span class="status-text">NODE // MMU_LIVE</span>
        </div>
        
        <ul>
            <li>Home</li>
            <li>Explore</li>
            <li>Transactions</li>
            <li>About us</li>
        </ul>
        <div class="nav-buttons"></div>
    </nav>

    <section class="hero">
        <h1 class="main-title">EcoLoop</h1>
        
        <h2 class="subtitle">THE FUTURE OF STUDENT MARKETPLACE STARTS HERE</h2>
        
        <p class="description">
            EcoLoop helps students to buy and sell their used items easily, save money, and <br>
            reduce waste within our beloved campus communities.
        </p>

        <div class="search-container">
            <form action="/search" method="get">
                <input type="text" name="query" placeholder="Search for items...">
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="action-container">
            <button class="btn-start-now">Start Now</button>
        </div>
    </section>

</body>
</html>
