<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="status-node">
            <span class="status-dot"></span>
            <span class="status-text">NODE // MMU_LIVE</span>
        </div>
        
        <ul>
            <li onclick="window.location.href='/'" style="cursor:pointer">Home</li>
            <li onclick="window.location.href='/student'" style="cursor:pointer">Explore</li>
            <li onclick="window.location.href='/dashboard'" style="cursor:pointer">Dashboard</li>
        </ul>
        <div class="nav-buttons"></div>
    </nav>

    <section class="hero">
        <h1 class="main-title">EcoLoop</h1>
        <h2 class="subtitle">THE FUTURE OF CAMPUS MARKETPLACES</h2>
        
        <p class="description">
            EcoLoop helps MMU students and staff buy or sell secondhand goods easily, <br>
            save money, and reduce waste within our campus community.
        </p>

        <div class="search-container">
            <form action="/search" method="get">
                <input type="text" name="query" placeholder="Search textbooks, lab kits, electronics..." required>
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="action-container">
            <button class="btn-start-now" onclick="window.location.href='/student'">Start Now</button>
        </div>
    </section>

</body>
</html>
