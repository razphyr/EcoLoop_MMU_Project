<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EcoLoop MMU — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root {
  --leaf: #4c8c15;
  --leaf-light: #eef7e4;
  --leaf-mid: #7ec139;
  --gold: #d98d26;
  --gold-light: #fdf5e8;
  --red: #e04444;
  --red-light: #fdeaea;
  --ink: #0b0e09;
  --ink2: #141a11;
  --ink3: #1d2519;
  --paper: #f4f6f2;
  --muted: #878f82;
  --border: rgba(255, 255, 255, 0.05);
  --white: #fff;
  --shadow: rgba(0, 0, 0, 0.4);
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--ink);
  color: var(--paper);
  min-height: 100vh;
  letter-spacing: -0.01em;
}

/* Sidebar Styling */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  background: var(--ink2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 2rem 1.2rem;
  z-index: 10;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--leaf-mid);
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}
.logo-sub {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 2.5rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  margin-bottom: 6px;
}
.nav-item.active {
  background: var(--leaf);
  color: #fff;
  box-shadow: 0 4px 12px rgba(76, 140, 21, 0.3);
}
.nav-item:hover:not(.active) {
  background: var(--ink3);
  color: var(--paper);
  transform: translateX(3px);
}
.nav-item i {
  font-size: 18px;
}
.sidebar-footer {
  margin-top: auto;
  font-size: 11px;
  color: #3b4535;
  border-top: 1px solid var(--border);
  padding-top: 1.2rem;
  font-weight: 500;
}

/* Main Screen Workspace */
.main {
  margin-left: 240px;
  padding: 2.5rem;
  min-height: 100vh;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2.5rem;
}
.page-title {
  font-family: 'DM Serif Display', serif;
  font-size: 32px;
  font-weight: 400;
  color: var(--paper);
}
.page-sub {
  font-size: 14px;
  color: var(--muted);
  margin-top: 4px;
}
.admin-badge {
  background: rgba(76, 140, 21, 0.15);
  border: 1px solid rgba(126, 193, 57, 0.3);
  color: var(--leaf-mid);
  vertical-align: middle;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 30px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Analytics Cards */
.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 2.5rem;
}
.stat-card {
  background: var(--ink2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.4rem;
  box-shadow: 0 4px 20px var(--shadow);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.stat-card:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
}
.stat-val {
  font-size: 30px;
  font-weight: 700;
  color: var(--paper);
  line-height: 1;
}
.stat-lbl {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.stat-card.accent {
  border-color: rgba(76, 140, 21, 0.4);
  background: linear-gradient(135deg, #13220b 0%, var(--ink2) 100%);
}
.stat-card.accent .stat-val {
  color: var(--leaf-mid);
  text-shadow: 0 0 15px rgba(126, 193, 57, 0.2);
}

/* Filters Component */
.filters-bar {
  display: grid;
  grid-template-columns: 1fr 130px 130px 180px auto auto;
  gap: 12px;
  margin-bottom: 1.8rem;
  align-items: center;
}
.filters-bar input, .filters-bar select {
  background: var(--ink2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--paper);
  outline: none;
  transition: all .2s;
}
.filters-bar input::placeholder {
  color: #434c3e;
}
.filters-bar input:focus, .filters-bar select:focus {
  border-color: var(--leaf-mid);
  background: var(--ink3);
  box-shadow: 0 0 0 3px rgba(126, 193, 57, 0.15);
}
.filters-bar select option {
  background: var(--ink2);
}
.btn-ghost {
  background: var(--ink2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--paper);
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-ghost:hover {
  background: var(--ink3);
  border-color: var(--leaf-mid);
}
.btn-danger-ghost {
  background: rgba(224, 68, 68, 0.05);
  border: 1px solid rgba(224, 68, 68, 0.2);
  border-radius: 10px;
  padding: 11px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--red);
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-danger-ghost:hover {
  background: var(--red);
  color: #fff;
  box-shadow: 0 4px 12px rgba(224, 68, 68, 0.2);
}

/* Modernized Grid Data Table */
.table-wrap {
  background: var(--ink2);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 25px var(--shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead tr {
  background: rgba(255, 255, 255, 0.01);
  border-bottom: 1px solid var(--border);
}
th {
  padding: 16px 20px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  text-align: left;
}
th:last-child {
  text-align: center;
}
td {
  padding: 16px 20px;
  font-size: 14px;
  color: var(--paper);
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  vertical-align: middle;
}
tbody tr:last-child td {
  border-bottom: none;
}
tbody tr {
  transition: background 0.15s ease;
}
tbody tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}
.item-name {
  font-weight: 500;
  color: var(--white);
}
.price-cell {
  color: var(--gold);
  font-weight: 700;
}
.student-link {
  color: var(--leaf-mid);
  cursor: pointer;
  font-weight: 500;
  transition: color 0.15s;
}
.student-link:hover {
  color: var(--white);
  text-decoration: underline;
}
.faculty-badge {
  display: inline-block;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 700;
  background: var(--ink3);
  color: var(--muted);
  border: 1px solid var(--border);
}

/* Semi-Transparent Modern Status Badges */
.badge-avail {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 30px;
  background: rgba(126, 193, 57, 0.12);
  color: var(--leaf-mid);
  border: 1px solid rgba(126, 193, 57, 0.2);
}
.badge-sold {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 30px;
  background: rgba(224, 68, 68, 0.1);
  color: var(--red);
  border: 1px solid rgba(224, 68, 68, 0.2);
}

/* Interactive Action Control Center */
.action-cell {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.btn-toggle {
  background: rgba(76, 140, 21, 0.1);
  border: 1px solid var(--leaf);
  color: var(--leaf-mid);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
}
.btn-toggle:hover {
  background: var(--leaf);
  color: #fff;
  box-shadow: 0 4px 12px rgba(76, 140, 21, 0.2);
}
.btn-del {
  background: rgba(224, 68, 68, 0.05);
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}
.btn-del:hover {
  background: var(--red);
  color: #fff;
  box-shadow: 0 4px 12px rgba(224, 68, 68, 0.2);
}
.empty-row td {
  text-align: center;
  padding: 3.5rem;
  color: var(--muted);
  font-weight: 500;
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">EcoLoop</div>
  <div class="logo-sub">MMU Admin Panel</div>
  <div class="nav-item active"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
  
  <div class="nav-item" onclick="window.location.href='/'"><i class="ti ti-building-store"></i> Student Panel</div>

  <div class="nav-item"><i class="ti ti-users"></i> Students</div>
  <div class="nav-item"><i class="ti ti-chart-bar"></i> Reports</div>
  <div class="sidebar-footer">EcoLoop MMU v1.0</div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Marketplace Overview</div>
      <div class="page-sub">Manage all student listings across faculties</div>
    </div>
    <div>
      <span class="admin-badge"><i class="ti ti-shield-check"></i> System Administrator</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card accent">
      <div class="stat-val" id="s-total">0</div>
      <div class="stat-lbl">Total listings</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-avail" style="color: var(--leaf-mid)">0</div>
      <div class="stat-lbl">Available</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-sold" style="color: var(--red)">0</div>
      <div class="stat-lbl">Sold</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-avail-val" style="color: var(--leaf-mid)">RM 0</div>
      <div class="stat-lbl">Available value</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-revenue" style="color: var(--gold)">RM 0</div>
      <div class="stat-lbl">Revenue earned</div>
    </div>
  </div>

  <div class="filters-bar">
    <input type="text" id="searchInput" placeholder="Search item or student..." oninput="applyFilters()">
    <input type="number" id="minPrice" placeholder="Min RM" oninput="applyFilters()">
    <input type="number" id="maxPrice" placeholder="Max RM" oninput="applyFilters()">
    <select id="facultyFilter" onchange="applyFilters()">
      <option value="">All Faculties</option>
      <option value="FCI">FCI</option>
      <option value="FOAIE">FOAIE</option>
      <option value="FCM">FCM</option>
    </select>
    <button class="btn-ghost" onclick="showAll()"><i class="ti ti-eye"></i> Show All</button>
    <button class="btn-danger-ghost" onclick="clearFilters()"><i class="ti ti-x"></i> Clear</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Student</th>
          <th>Faculty</th>
          <th>Status</th>
          <th style="text-align:center">Actions</th>
        </tr>
      </thead>
      <tbody id="itemTable"></tbody>
    </table>
  </div>
</div>

<script>
// Live execution state handling structures
let items = [];
let activeFilter = { search: '', min: '', max: '', faculty: '' };

function render() {
  const tbody = document.getElementById('itemTable');
  const f = activeFilter;

  const filtered = items.filter(it => {
    const okSearch = !f.search || it.name.toLowerCase().includes(f.search) || it.student.toLowerCase().includes(f.search);
    const okMin = !f.min || it.price >= parseFloat(f.min);
    const okMax = !f.max || it.price <= parseFloat(f.max);
    const okFaculty = !f.faculty || it.faculty === f.faculty;
    return okSearch && okMin && okMax && okFaculty;
  });

  if (!filtered.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No listings found</td></tr>';
    updateStats();
    return;
  }

  tbody.innerHTML = filtered.map(it => `
    <tr data-id="${it.id}">
      <td class="item-name">${it.name}</td>
      <td class="price-cell">RM ${parseFloat(it.price).toFixed(2)}</td>
      <td><span class="student-link" onclick="filterByStudent('${it.student}')">${it.student}</span></td>
      <td><span class="faculty-badge">${it.faculty}</span></td>
      <td><span class="badge-${it.sold ? 'sold' : 'avail'}">${it.sold ? 'Sold' : 'Available'}</span></td>
      <td>
        <div class="action-cell">
          <button class="btn-toggle" onclick="toggleStatus(${it.id})">Toggle</button>
          <button class="btn-del" onclick="deleteItem(${it.id})">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
  updateStats();
}

function updateStats() {
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-avail').textContent = items.filter(i=>!i.sold).length;
  document.getElementById('s-sold').textContent = items.filter(i=>i.sold).length;
  const availVal = items.filter(i=>!i.sold).reduce((s,i)=>s+i.price,0);
  const revenue = items.filter(i=>i.sold).reduce((s,i)=>s+i.price,0);
  document.getElementById('s-avail-val').textContent = 'RM '+availVal.toLocaleString();
  document.getElementById('s-revenue').textContent = 'RM '+revenue.toLocaleString();
}

function toggleStatus(id){
  fetch(`http://127.0.0.1:5000/items/${id}`, { method: "PUT" })
  .then(res => res.json())
  .then(updated => {
    const index = items.findIndex(i => i.id === id);
    if(index !== -1){
      items[index] = updated;
      render();
    }
  });
}

function deleteItem(id){
  fetch(`http://127.0.0.1:5000/items/${id}`, { method: "DELETE" })
  .then(res => res.json())
  .then(() => {
    items = items.filter(i => i.id !== id);
    render();
  });
}

function filterByStudent(name) {
  document.getElementById('searchInput').value = name;
  activeFilter.search = name.toLowerCase();
  render();
}

function applyFilters() {
  activeFilter.search = document.getElementById('searchInput').value.toLowerCase();
  activeFilter.min = document.getElementById('minPrice').value;
  activeFilter.max = document.getElementById('maxPrice').value;
  activeFilter.faculty = document.getElementById('facultyFilter').value;
  render();
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('minPrice').value = '';
  document.getElementById('maxPrice').value = '';
  document.getElementById('facultyFilter').value = '';
  activeFilter = {search:'',min:'',max:'',faculty:''};
  render();
}

function showAll() { clearFilters(); }

function loadItems(){
  fetch("http://127.0.0.1:5000/items")
    .then(res => res.json())
    .then(data => {
      items = data;
      render();
    });
}
loadItems();
</script>
</body>
</html>
