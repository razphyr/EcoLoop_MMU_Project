<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Node History Ledger // EcoLoop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        /* ==========================================================
           🌌 PREMIUM FOREST MATRIX THEME - LOGISTICS DASHBOARD
           🎨 Palette: Obsidian Jade | Emerald Glow | Muted Crimson
           ========================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #081111 !important; /* Deep obsidian jade base */
            color: #f4f6f2;
            padding: 30px;
        }

        /* 🔥 BRAND-MATCHED RADIANT LIQUID BACKGROUND LAYER */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 85% 50%, rgba(16, 185, 129, 0.45) 0%, transparent 55%),
                        radial-gradient(circle at 15% 50%, rgba(31, 23, 38, 0.8) 0%, transparent 60%),
                        radial-gradient(circle at 50% 20%, rgba(5, 150, 105, 0.25) 0%, transparent 50%);
            background-size: 150% 150%;
            animation: liquidStreamOne 16s ease-in-out infinite alternate;
        }

        @keyframes liquidStreamOne { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4%;
            background: rgba(11, 24, 23, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            z-index: 10;
            position: relative;
            margin-bottom: 40px;
        }

        .status-node {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #94a3b8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        nav ul li {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        nav ul li:hover { color: #ffffff; }

        .dashboard-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
            text-align: left;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .section-desc {
            font-size: 0.95rem;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .grid-container {
            display: grid;
            gap: 20px;
        }

        .ledger-card {
            background: rgba(11, 24, 23, 0.85) !important;
            border: 1px solid rgba(16, 185, 129, 0.15);
            padding: 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }

        .ledger-card:hover {
            transform: translateX(4px);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .item-details h4 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .item-details p {
            color: #94a3b8;
            font-size: 14px;
        }

        .metrics-block {
            text-align: right;
        }

        .item-cost {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ba7517;
            display: block;
            margin-bottom: 4px;
        }

        .role-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .role-badge.selling { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .role-badge.acquired { background: rgba(220, 38, 38, 0.12); color: #ef4444; border: 1px solid rgba(220, 38, 38, 0.2); }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #64748b;
            background: rgba(11, 24, 23, 0.4);
            border: 1px dashed rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <nav>
        <div class="status-node" onclick="window.location.href='/student'" style="cursor:pointer">
            <span class="status-dot"></span>
            <span class="status-text">PERSONAL HISTORY LEDGER</span>
        </div>
        <ul>
            <li onclick="window.location.href='/'">Home</li>
            <li onclick="window.location.href='/student'">Explore</li>
            <li onclick="window.location.href='/dashboard'" style="color:#10b981;">Dashboard</li>
            <li onclick="localStorage.clear(); window.location.href='/'" style="color:#dc2626; font-weight:700;"><i class="ti ti-logout"></i> Logout</li>
        </ul>
    </nav>

    <div class="dashboard-wrapper">
        <h2>Your Workspace History</h2>
        <p class="section-desc">Track items you are currently selling or assets you have acquired inside the node.</p>
        
        <div id="dashboardContainer" class="grid-container"></div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (!user.name) window.location.href = '/login';
        
        function loadDashboardLedger() {
            fetch('/items')
            .then(res => res.json())
            .then(data => {
                // Filter listings matching your current active session username
                const myTransactions = data.filter(i => i.student === user.name || i.buyer === user.name);
                const container = document.getElementById('dashboardContainer');
                
                if (myTransactions.length === 0) {
                    container.innerHTML = `<div class="empty-state">No computing marketplace interactions logged under your profile root parameter.</div>`;
                    return;
                }

                container.innerHTML = myTransactions.map(i => {
                    const isOwner = i.student === user.name;
                    return `
                    <div class="ledger-card">
                        <div class="item-details">
                            <h4>${i.name}</h4>
                            <p>${i.description}</p>
                        </div>
                        <div class="metrics-block">
                            <span class="item-cost">RM ${parseFloat(i.price).toFixed(2)}</span>
                            <span class="role-badge ${isOwner ? 'selling' : 'acquired'}">
                                ${isOwner ? 'Selling Asset' : 'Acquired Asset'}
                            </span>
                        </div>
                    </div>`;
                }).join('');
            });
        }
        
        loadDashboardLedger();
    </script>
</body>
</html>
