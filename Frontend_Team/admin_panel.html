<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLoop MMU — Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        /* ==========================================================
           🌌 PREMIUM FOREST MATRIX THEME - ADMIN SYSTEM
           🎨 Palette: Obsidian Jade | Emerald Glow | Muted Crimson
           ========================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #081111; color: #f4f6f2; display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Left Command Sidebar Anchor */
        .sidebar-panel { width: 260px; background: #0b1817; border-right: 1px solid rgba(16, 185, 129, 0.15); padding: 35px 24px; display: flex; flex-direction: column; gap: 40px; position: fixed; height: 100vh; z-index: 10; }
        .panel-brand h1 { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .panel-brand span { color: #10b981; }
        .panel-brand p { font-size: 11px; font-weight: 700; color: #4b5563; letter-spacing: 1px; margin-top: 4px; }

        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; font-size: 14.5px; font-weight: 600; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
        .menu-item:hover, .menu-item.active { background: rgba(16, 185, 129, 0.08); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.15); }
        .menu-item.exit { color: #f43f5e; margin-top: auto; }
        .menu-item.exit:hover { background: rgba(244, 63, 94, 0.08); border-color: rgba(244, 63, 94, 0.15); }

        /* Core Workspace Section Layout */
        .main-workspace { margin-left: 260px; flex: 1; padding: 50px; position: relative; z-index: 5; }
        .hub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .hub-header h2 { font-size: 28px; color: #fff; font-weight: 700; }
        .hub-header p { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .role-pill { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; font-size: 11px; font-weight: 700; padding: 6px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Metric Indicator Blocks */
        .analytics-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-bottom: 35px; }
        .metric-node { background: rgba(11, 24, 23, 0.6); border: 1px solid rgba(16, 185, 129, 0.1); padding: 22px; border-radius: 16px; backdrop-filter: blur(10px); text-align: left; }
        .metric-node.accent { border-color: #10b981; background: linear-gradient(135deg, rgba(16,185,129,0.08) 0%, rgba(11,24,23,0.6) 100%); }
        .metric-val { font-size: 32px; font-weight: 700; color: #fff; line-height: 1; }
        .metric-lbl { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }

        /* Filters */
        .filters-bar { display: grid; grid-template-columns: 1fr 110px 110px 150px auto auto; gap: 10px; margin-bottom: 25px; align-items: center; }
        .filters-bar input, .filters-bar select { background: rgba(11, 24, 23, 0.6); border: 1px solid rgba(16, 185, 129, 0.15); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #f4f6f2; outline: none; }
        .filters-bar input::placeholder { color: #4b5563; }
        .btn-ghost { background: transparent; border: 1px solid rgba(148,163,184,0.25); border-radius: 10px; padding: 10px 16px; font-size: 13px; color: #94a3b8; cursor: pointer; white-space: nowrap; }
        .btn-ghost:hover { border-color: #10b981; color: #10b981; }
        .btn-danger-ghost { background: transparent; border: 1px solid rgba(244,63,94,0.3); border-radius: 10px; padding: 10px 16px; font-size: 13px; color: #f43f5e; cursor: pointer; white-space: nowrap; }
        .btn-danger-ghost:hover { background: #f43f5e; color: #081111; }

        /* Registry Data Table Grid Layout */
        .data-shield { background: rgba(11, 24, 23, 0.4); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 20px; overflow: hidden; backdrop-filter: blur(16px); }
        .table-head-row { display: grid; grid-template-columns: 1.4fr 100px 1fr 100px 110px 100px; background: rgba(16, 185, 129, 0.04); border-bottom: 1px solid rgba(16, 185, 129, 0.1); padding: 18px 24px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; text-align: left; }

        .item-row { display: grid; grid-template-columns: 1.4fr 100px 1fr 100px 110px 100px; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); font-size: 14px; text-align: left; transition: background 0.2s; }
        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background: rgba(16, 185, 129, 0.02); }

        .item-name { font-weight: 600; color: #fff; }
        .price-cell { color: #f5c26b; font-weight: 700; }
        .student-link { color: #10b981; cursor: pointer; font-weight: 600; }
        .faculty-badge { display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; background: rgba(148,163,184,0.08); color: #94a3b8; }
        .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.avail { background: rgba(16,185,129,0.1); color: #10b981; }
        .status-badge.sold { background: rgba(244,63,94,0.1); color: #f43f5e; }

        .btn-action-dismiss { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #f43f5e; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; }
        .btn-action-dismiss:hover { background: #f43f5e; color: #081111; box-shadow: 0 0 10px rgba(244, 63, 94, 0.4); }
        .empty-state { text-align: center; padding: 60px; color: #64748b; font-size: 15px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar-panel">
        <div class="panel-brand">
            <h1>Eco<span>Loop</span></h1>
            <p>MMU ADMIN PANEL</p>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item active" onclick="window.location.href='/admin'"><i class="ti ti-layout-dashboard"></i> Dashboard</li>
            <li class="menu-item" onclick="window.location.href='/admin/items'"><i class="ti ti-message-report"></i> Feedback Hub</li>
            <li class="menu-item exit" onclick="localStorage.clear(); window.location.href='/'"><i class="ti ti-logout"></i> Exit Terminal</li>
        </ul>
    </div>

    <div class="main-workspace">
        <div class="hub-header">
            <div>
                <h2>Marketplace Overview</h2>
                <p>Manage all student listings across faculties.</p>
            </div>
            <span class="role-pill">Admin</span>
        </div>

        <div class="analytics-row">
            <div class="metric-node accent"><div class="metric-val" id="s-total">0</div><div class="metric-lbl">Total Listings</div></div>
            <div class="metric-node"><div class="metric-val" id="s-avail" style="color:#10b981">0</div><div class="metric-lbl">Available</div></div>
            <div class="metric-node"><div class="metric-val" id="s-sold" style="color:#f43f5e">0</div><div class="metric-lbl">Sold</div></div>
            <div class="metric-node"><div class="metric-val" id="s-avail-val" style="color:#10b981">RM 0</div><div class="metric-lbl">Available Value</div></div>
            <div class="metric-node"><div class="metric-val" id="s-revenue" style="color:#f5c26b">RM 0</div><div class="metric-lbl">Revenue Earned</div></div>
        </div>

        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="Search item or student..." oninput="applyFilters()">
            <input type="number" id="minPrice" placeholder="Min RM" oninput="applyFilters()">
            <input type="number" id="maxPrice" placeholder="Max RM" oninput="applyFilters()">
            <select id="facultyFilter" onchange="applyFilters()">
                <option value="">All Faculties</option>
                <option value="FCI">FCI</option>
                <option value="FOAIE">FOAIE</option>
                <option value="FCM">FCM</option>
            </select>
            <button class="btn-ghost" onclick="showAll()"><i class="ti ti-eye" style="font-size:14px;vertical-align:-2px"></i> Show All</button>
            <button class="btn-danger-ghost" onclick="clearFilters()"><i class="ti ti-x" style="font-size:14px;vertical-align:-2px"></i> Clear</button>
        </div>

        <div class="data-shield">
            <div class="table-head-row">
                <div>Item</div>
                <div>Price</div>
                <div>Student</div>
                <div>Faculty</div>
                <div>Status</div>
                <div>Action</div>
            </div>
            <div id="itemTable"></div>
        </div>
    </div>

<script>
let items = [];
let activeFilter = { search:'', min:'', max:'', faculty:'' };

const session = JSON.parse(localStorage.getItem('currentUser') || '{}');
if (session.role !== 'admin') window.location.href = '/login';

function render() {
  const tbody = document.getElementById('itemTable');
  const f = activeFilter;

  const filtered = items.filter(it => {
    const okSearch = !f.search || it.name.toLowerCase().includes(f.search) || it.student.toLowerCase().includes(f.search);
    const okMin = !f.min || it.price >= parseFloat(f.min);
    const okMax = !f.max || it.price <= parseFloat(f.max);
    const okFaculty = !f.faculty || it.faculty === f.faculty;
    return okSearch && okMin && okMax && okFaculty;
  });

  if (!filtered.length) {
    tbody.innerHTML = '<div class="empty-state">No listings found</div>';
    updateStats();
    return;
  }

  tbody.innerHTML = filtered.map(it => `
    <div class="item-row" data-id="${it.id}">
      <div class="item-name">${it.name}</div>
      <div class="price-cell">RM ${parseFloat(it.price).toFixed(2)}</div>
      <div><span class="student-link" onclick="filterByStudent('${it.student}')">${it.student}</span></div>
      <div><span class="faculty-badge">${it.faculty || 'FCI'}</span></div>
      <div><span class="status-badge ${it.sold ? 'sold' : 'avail'}">${it.sold ? 'Sold' : 'Available'}</span></div>
      <div><button class="btn-action-dismiss" onclick="deleteItem(${it.id})">Delete</button></div>
    </div>
  `).join('');
  updateStats();
}

function updateStats() {
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-avail').textContent = items.filter(i=>!i.sold).length;
  document.getElementById('s-sold').textContent = items.filter(i=>i.sold).length;
  const availVal = items.filter(i=>!i.sold).reduce((s,i)=>s+i.price,0);
  const revenue = items.filter(i=>i.sold).reduce((s,i)=>s+i.price,0);
  document.getElementById('s-avail-val').textContent = 'RM '+availVal.toLocaleString();
  document.getElementById('s-revenue').textContent = 'RM '+revenue.toLocaleString();
}

function deleteItem(id){
  if(!confirm("Are you sure you want to delete this listing?")) return;
  fetch(`/items/${id}`, { method: "DELETE" })
  .then(() => {
    items = items.filter(i => i.id !== id);
    render();
  });
}

function filterByStudent(name) {
  document.getElementById('searchInput').value = name;
  activeFilter.search = name.toLowerCase();
  render();
}

function applyFilters() {
  activeFilter.search = document.getElementById('searchInput').value.toLowerCase();
  activeFilter.min = document.getElementById('minPrice').value;
  activeFilter.max = document.getElementById('maxPrice').value;
  activeFilter.faculty = document.getElementById('facultyFilter').value;
  render();
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('minPrice').value = '';
  document.getElementById('maxPrice').value = '';
  document.getElementById('facultyFilter').value = '';
  activeFilter = {search:'',min:'',max:'',faculty:''};
  render();
}

function showAll() { clearFilters(); }
function loadItems(){
  fetch("/items")
    .then(res => res.json())
    .then(data => {
      items = data;
      render();
    });
}
loadItems();
</script>
</body>
</html>
