<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EcoLoop MMU — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --leaf:#3B6D11;--leaf-light:#EAF3DE;--leaf-mid:#639922;
  --gold:#BA7517;--gold-light:#FAEEDA;
  --red:#A32D2D;--red-light:#FCEBEB;
  --ink:#1a1f16;--ink2:#2e3529;
  --paper:#f6f5f0;--paper2:#eeeae0;
  --muted:#7a7a6e;--border:#d8d4c8;
  --white:#fff;
}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--paper);min-height:100vh}

.sidebar{position:fixed;top:0;left:0;width:220px;height:100vh;background:var(--ink2);border-right:0.5px solid #3a3f34;display:flex;flex-direction:column;padding:1.5rem 1rem;z-index:10}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--leaf-mid);margin-bottom:4px}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:4px}
.nav-item.active{background:var(--leaf);color:#fff}
.nav-item:hover:not(.active){background:#3a3f34;color:var(--paper)}
.sidebar-footer{margin-top:auto;font-size:11px;color:#4a4f44;border-top:0.5px solid #3a3f34;padding-top:1rem}

.main{margin-left:220px;padding:2rem;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;color:var(--paper)}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.admin-badge{background:var(--leaf);color:#fff;font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:2rem}
.stat-card{background:var(--ink2);border:0.5px solid #3a3f34;border-radius:12px;padding:1.1rem 1.2rem}
.stat-val{font-size:28px;font-weight:500;color:var(--paper);line-height:1}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:5px}
.stat-card.accent{border-color:var(--leaf);background:linear-gradient(135deg,#1e2e18 0%,var(--ink2) 100%)}
.stat-card.accent .stat-val{color:var(--leaf-mid)}

.filters-bar{display:grid;grid-template-columns:1fr 120px 120px 160px auto auto;gap:10px;margin-bottom:1.5rem;align-items:center}
.filters-bar input,.filters-bar select{background:var(--ink2);border:0.5px solid #3a3f34;border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--paper);outline:none;}
.filters-bar input::placeholder{color:#4a4f44}
.btn-ghost{background:transparent;border:0.5px solid #3a3f34;border-radius:8px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.btn-danger-ghost{background:transparent;border:0.5px solid var(--red);border-radius:8px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--red);cursor:pointer;white-space:nowrap}
.btn-danger-ghost:hover{background:var(--red);color:#fff}

.table-wrap{background:var(--ink2);border:0.5px solid #3a3f34;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:0.5px solid #3a3f34}
th{padding:12px 16px;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left}
td{padding:13px 16px;font-size:13px;color:var(--paper);border-bottom:0.5px solid #2a2f24;vertical-align:middle}
.item-name{font-weight:500;color:var(--paper)}
.price-cell{color:var(--gold);font-weight:500}
.student-link{color:#639922;cursor:pointer;font-weight:500}
.faculty-badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;background:#2a2f24;color:var(--muted)}
.badge-avail{background:#1a2e18;color:#639922}
.badge-sold{background:#2e1a1a;color:#c9504f}
.action-cell{display:flex;gap:6px;justify-content:center}
.btn-toggle{background:#1e2e18;border:0.5px solid var(--leaf);color:var(--leaf-mid);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;}
.btn-toggle:hover{background:var(--leaf);color:#fff}
.btn-del{background:#2e1a1a;border:0.5px solid var(--red);color:var(--red);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;}
.btn-del:hover{background:var(--red);color:#fff}
.empty-row td{text-align:center;padding:2.5rem;color:#4a4f44}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">EcoLoop</div>
  <div class="logo-sub">MMU Admin Panel</div>
  <div class="nav-item active" onclick="window.location.href='/admin'"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
  <div class="nav-item" onclick="window.location.href='/admin/items'"><i class="ti ti-building-store"></i> Student Panel</div>
  <div class="nav-item" onclick="localStorage.clear(); window.location.href='/'" style="color:#ef4444;"><i class="ti ti-logout"></i> Exit Terminal</div>
  <div class="sidebar-footer">EcoLoop MMU v1.0</div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Marketplace Overview</div>
      <div class="page-sub">Manage all student listings across faculties</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="admin-badge"><i class="ti ti-shield-check" style="font-size:11px"></i> Admin</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card accent">
      <div class="stat-val" id="s-total">0</div>
      <div class="stat-lbl">Total listings</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-avail" style="color:#639922">0</div>
      <div class="stat-lbl">Available</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-sold" style="color:#c9504f">0</div>
      <div class="stat-lbl">Sold</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-avail-val" style="color:var(--leaf-mid)">RM 0</div>
      <div class="stat-lbl">Available value</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-revenue" style="color:var(--gold)">RM 0</div>
      <div class="stat-lbl">Revenue earned</div>
    </div>
  </div>

  <div class="filters-bar">
    <input type="text" id="searchInput" placeholder="Search item or student..." oninput="applyFilters()">
    <input type="number" id="minPrice" placeholder="Min RM" oninput="applyFilters()">
    <input type="number" id="maxPrice" placeholder="Max RM" oninput="applyFilters()">
    <select id="facultyFilter" onchange="applyFilters()">
      <option value="">All Faculties</option>
      <option value="FCI">FCI</option>
      <option value="FOAIE">FOAIE</option>
      <option value="FCM">FCM</option>
    </select>
    <button class="btn-ghost" onclick="showAll()"><i class="ti ti-eye" style="font-size:14px;vertical-align:-2px"></i> Show All</button>
    <button class="btn-danger-ghost" onclick="clearFilters()"><i class="ti ti-x" style="font-size:14px;vertical-align:-2px"></i> Clear</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Student</th>
          <th>Faculty</th>
          <th>Status</th>
          <th style="text-align:center">Actions</th>
        </tr>
      </thead>
      <tbody id="itemTable"></tbody>
    </table>
  </div>
</div>

<script>
let items = [];
let activeFilter = { search:'', min:'', max:'', faculty:'' };

const session = JSON.parse(localStorage.getItem('currentUser') || '{}');
if (session.role !== 'admin') window.location.href = '/login';

function render() {
  const tbody = document.getElementById('itemTable');
  const f = activeFilter;

  const filtered = items.filter(it => {
    const okSearch = !f.search || it.name.toLowerCase().includes(f.search) || it.student.toLowerCase().includes(f.search);
    const okMin = !f.min || it.price >= parseFloat(f.min);
    const okMax = !f.max || it.price <= parseFloat(f.max);
    const okFaculty = !f.faculty || it.faculty === f.faculty;
    return okSearch && okMin && okMax && okFaculty;
  });

  if (!filtered.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No listings found</td></tr>';
    updateStats();
    return;
  }

  tbody.innerHTML = filtered.map(it => `
    <tr data-id="${it.id}">
      <td class="item-name">${it.name}</td>
      <td class="price-cell">RM ${parseFloat(it.price).toFixed(2)}</td>
      <td><span class="student-link" onclick="filterByStudent('${it.student}')">${it.student}</span></td>
      <td><span class="faculty-badge">${it.faculty || 'FCI'}</span></td>
      <td><span class="badge-${it.sold ? 'sold' : 'avail'}">${it.sold ? 'Sold' : 'Available'}</span></td>
      <td>
        <div class="action-cell">
          <button class="btn-del" onclick="deleteItem(${it.id})">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
  updateStats();
}

function updateStats() {
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-avail').textContent = items.filter(i=>!i.sold).length;
  document.getElementById('s-sold').textContent = items.filter(i=>i.sold).length;
  const availVal = items.filter(i=>!i.sold).reduce((s,i)=>s+i.price,0);
  const revenue = items.filter(i=>i.sold).reduce((s,i)=>s+i.price,0);
  document.getElementById('s-avail-val').textContent = 'RM '+availVal.toLocaleString();
  document.getElementById('s-revenue').textContent = 'RM '+revenue.toLocaleString();
}



function deleteItem(id){
  if(!confirm("Are you sure you want to delete this listing?")) return;
  fetch(`/items/${id}`, { method: "DELETE" })
  .then(() => {
    items = items.filter(i => i.id !== id);
    render();
  });
}

function filterByStudent(name) {
  document.getElementById('searchInput').value = name;
  activeFilter.search = name.toLowerCase();
  render();
}

function applyFilters() {
  activeFilter.search = document.getElementById('searchInput').value.toLowerCase();
  activeFilter.min = document.getElementById('minPrice').value;
  activeFilter.max = document.getElementById('maxPrice').value;
  activeFilter.faculty = document.getElementById('facultyFilter').value;
  render();
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('minPrice').value = '';
  document.getElementById('maxPrice').value = '';
  document.getElementById('facultyFilter').value = '';
  activeFilter = {search:'',min:'',max:'',faculty:''};
  render();
}

function showAll() { clearFilters(); }
function loadItems(){
  fetch("/items")
    .then(res => res.json())
    .then(data => {
      items = data;
      render();
    });
}
loadItems();
</script>
</body>
</html>
