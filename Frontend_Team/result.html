<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results - Eco Loop</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .results-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(20, 26, 17, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            color: #ffffff;
        }
        .query-highlight { color: #dc2626; }
        ul { list-style: none; padding: 0; }
        li {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 18px 22px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:hover {
            background: rgba(6, 95, 70, 0.2);
            border-color: rgba(126, 193, 57, 0.3);
            transform: translateX(4px);
        }
        .item-details { display: flex; flex-direction: column; gap: 4px; }
        strong { color: #fff; font-size: 1.15rem; }
        .item-desc { color: #878f82; font-size: 0.95rem; }
        .faculty-badge {
            color: #7ec139;
            font-weight: 700;
            font-size: 0.85rem;
            background: rgba(126, 193, 57, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(126, 193, 57, 0.2);
        }
        .empty-state { text-align: center; color: #878f82; padding: 40px 0; font-size: 1.1rem; }
        nav.results-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(11, 14, 9, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        nav.results-nav a { color: #ffffff; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        nav.results-nav a:hover { color: #dc2626; }
    </style>
</head>
<body>

    <nav class="results-nav">
        <h2 style="font-family: 'Segoe UI', sans-serif; letter-spacing: 0.5px;">EcoLoop Search Results</h2>
        <a href="/">Back to Home</a>
    </nav>

    <section class="results-container">
        <h1>Search Returns for: <span class="query-highlight">"{{ query }}"</span></h1>
        <ul>
            {% for item in items %}
                <li>
                    <div class="item-details">
                        <strong>{{ item.name }} (RM {{ "%.2f"|format(item.price) }})</strong>
                        <span class="item-desc">{{ item.description }}</span>
                    </div>
                    <span class="faculty-badge">{{ item.faculty }}</span>
                </li>
            {% else %}
                <div class="empty-state">No listings matched your criteria on campus.</div>
            {% endfor %}
        </ul>
    </section>

</body>
</html>
