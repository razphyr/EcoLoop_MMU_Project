<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoLoop Student Marketplace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --eco-leaf:#2E5B0D;
  --eco-leaf-light:#EBF3E6;
  --eco-leaf-mid:#55961E;
  --eco-bark:#4E4D4A;
  --eco-cream:#F5F3EC;
  --eco-gold:#B57415;
  --eco-gold-light:#FAF4E8;
  --eco-red:#BC3434;
  --eco-red-light:#FDF0F0;
  --bg:#F8F7F4;
  --surface:#ffffff;
  --surface2:#FAF9F5;
  --text:#1C1E1A;
  --text2:#757A70;
  --border: rgba(0,0,0,0.06);
  --shadow: rgba(46, 91, 13, 0.08);
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:2.5rem;
  min-height:100vh;
  letter-spacing: -0.01em;
}

/* Header & Navigation Area */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:2rem;
  flex-wrap:wrap;
  gap:16px;
}
h1{
  font-family:'DM Serif Display',serif;
  font-size:36px;
  font-weight:400;
  color:var(--eco-leaf);
  letter-spacing:-0.2px;
}
.subtitle{
  font-size:14px;
  color:var(--text2);
  margin-top:2px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sell-btn{
  background:var(--eco-leaf);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:10px 20px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow: 0 4px 12px rgba(46, 91, 13, 0.2);
  transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sell-btn:hover{
  background:var(--eco-leaf-mid);
  transform:translateY(-1px);
  box-shadow: 0 6px 16px rgba(46, 91, 13, 0.3);
}
.admin-btn {
  background:transparent;
  color:var(--text2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 16px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}
.admin-btn:hover {
  background: var(--surface);
  border-color: var(--eco-leaf-mid);
  color: var(--eco-leaf);
}

/* Dashboard Summary Counters */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:2.5rem;
}
.stat{
  background:var(--surface);
  border: 1px solid var(--border);
  border-radius:16px;
  padding:1.2rem 1.4rem;
  box-shadow: 0 4px 15px rgba(0,0,0,0.02);
  transition: transform 0.2s;
}
.stat:hover {
  transform: translateY(-2px);
}
.stat-val{
  font-size:32px;
  font-weight:700;
  color: var(--eco-leaf);
  line-height:1;
}
.stat-lbl {
  font-size:12px;
  font-weight:700;
  color:var(--text2);
  margin-top:6px;
  text-transform:uppercase;
  letter-spacing:0.04em;
}

/* Navigation Segment Filters */
.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:2rem;
  background: rgba(0, 0, 0, 0.02);
  padding: 6px;
  border-radius: 14px;
  display: inline-flex;
}
.filter-btn{
  background:transparent;
  border:none;
  border-radius:10px;
  padding:7px 16px;
  font-size:14px;
  font-weight:500;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  color:var(--text2);
  transition:all 0.15s ease;
}
.filter-btn.active{
  background:var(--surface);
  color:var(--eco-leaf);
  font-weight:700;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
.filter-btn:hover:not(.active){
  color:var(--text);
  background: rgba(0,0,0,0.02);
}

/* Marketplace Product Feed Layout */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow: 0 12px 25px var(--shadow);
  border-color: rgba(85, 150, 30, 0.2);
}
.card.is-sold{
  opacity:.45;
}
.card.is-sold:hover {
  transform: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  border-color: var(--border);
}
.card-img{
  width:100%;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  background:linear-gradient(135deg, var(--eco-cream) 0%, #FAF9F5 100%);
  border-bottom: 1px solid var(--border);
}
.card-body{
  padding:16px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}
.card-name{
  font-size:16px;
  font-weight:700;
  color: var(--text);
  margin-bottom:4px;
  line-height: 1.3;
}
.card-meta {
  font-size:13px;
  color:var(--text2);
  margin-bottom:12px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.price{
  color:var(--eco-gold);
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
}
.card-footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid rgba(0,0,0,0.03);
}

/* Product Badges */
.badge{
  font-size:11px;
  font-weight:700;
  padding:4px 10px;
  border-radius:30px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.badge.available{
  background:var(--eco-leaf-light);
  color:var(--eco-leaf);
}
.badge.sold{
  background:var(--eco-red-light);
  color:var(--eco-red);
}

/* Purchase Interactions */
.buy-btn{
  font-size:13px;
  font-weight: 700;
  background:var(--surface);
  color:var(--eco-leaf);
  border:1px solid var(--eco-leaf-mid);
  border-radius:8px;
  padding:6px 14px;
  cursor:pointer;
  transition:all 0.2s;
}
.buy-btn:hover{
  background: var(--eco-leaf);
  border-color: var(--eco-leaf);
  color: #fff;
  box-shadow: 0 4px 10px rgba(46, 91, 13, 0.15);
}

/* Item Creation Window Context layout */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(28, 30, 26, 0.6);
  backdrop-filter: blur(4px);
  z-index:100;
  align-items:center;
  justify-content:center;
  transition: all 0.2s;
}
.overlay.open{
  display:flex;
}
.modal{
  background:#fff;
  border-radius:20px;
  padding:1.8rem;
  width:360px;
  max-width:94vw;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  border: 1px solid rgba(255,255,255,0.8);
}
.modal h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--eco-leaf);
  margin-bottom: 1rem;
}
.field{
  margin-bottom:12px;
}
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 4px;
  text-transform: uppercase;
}
.field input, .field select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  background: var(--bg);
  transition: all 0.2s;
}
.field input:focus, .field select:focus {
  border-color: var(--eco-leaf-mid);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(85, 150, 30, 0.15);
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 1.5rem;
}
.btn-submit {
  flex: 1;
  background: var(--eco-leaf);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-submit:hover {
  background: var(--eco-leaf-mid);
}
.btn-cancel {
  background: var(--eco-cream);
  color: var(--bark);
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-cancel:hover {
  background: #e9e5da;
}
</style>
</head>

<body>

<div class="topbar">
  <div>
    <h1>EcoLoop Market</h1>
    <p class="subtitle">Secondhand goods, first-rate value</p>
  </div>
  <div class="header-actions">
    <a href="/admin" class="admin-btn"><i class="ti ti-shield-check"></i> Admin Dashboard</a>
    <button class="sell-btn" onclick="openModal()"><i class="ti ti-plus"></i> Sell item</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Listings</div></div>
  <div class="stat"><div class="stat-val" id="s-avail" style="color:var(--eco-leaf-mid)">0</div><div class="stat-lbl">Available</div></div>
  <div class="stat"><div class="stat-val" id="s-sold" style="color:var(--eco-red)">0</div><div class="stat-lbl">Sold</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('All',this)">All</button>
  <button class="filter-btn" onclick="setFilter('Available',this)">Available</button>
  <button class="filter-btn" onclick="setFilter('Sold',this)">Sold</button>
  <button class="filter-btn" onclick="setFilter('FCI',this)">FCI</button>
  <button class="filter-btn" onclick="setFilter('FOAIE',this)">FOAIE</button>
  <button class="filter-btn" onclick="setFilter('FCM',this)">FCM</button>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>List an Item</h3>

    <div class="field">
      <label>Item Name</label>
      <input id="name" placeholder="e.g., Python Programming Guide">
    </div>
    <div class="field">
      <label>Price (RM)</label>
      <input id="price" type="number" placeholder="e.g., 25">
    </div>
    <div class="field">
      <label>Your Name</label>
      <input id="student" placeholder="e.g., Azfar Hakim">
    </div>
    <div class="field">
      <label>Faculty</label>
      <select id="faculty">
        <option>FCI</option>
        <option>FOAIE</option>
        <option>FCM</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-submit" onclick="addItem()">List Item</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const EMOJI = { FCI:'💻', FOAIE:'📊', FCM:'🔬' };

let items = [];
let activeFilter = 'All';

function setFilter(f,btn){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const grid = document.getElementById('grid');

  const filtered = items.filter(it=>{
    if(activeFilter==='Available') return !it.sold;
    if(activeFilter==='Sold') return it.sold;
    if(['FCI','FOAIE','FCM'].includes(activeFilter)) return it.faculty===activeFilter;
    return true;
  });

  grid.innerHTML = filtered.map(it=>{
    return `
    <div class="card ${it.sold?'is-sold':''}">
      <div class="card-img">${EMOJI[it.faculty] || '📦'}</div>
      <div class="card-body">
        <div class="card-name">${it.name}</div>
        <div class="card-meta"><i class="ti ti-user" style="font-size:12px"></i> ${it.student} · ${it.faculty}</div>
        <div class="price">RM ${parseFloat(it.price).toFixed(2)}</div>
        <div class="card-footer-row">
          <div class="badge ${it.sold?'sold':'available'}">
            ${it.sold?'Sold':'Available'}
          </div>
          ${it.sold?'':`<button class="buy-btn" onclick="buy(${it.id})">Buy</button>`}
        </div>
      </div>
    </div>`;
  }).join('');

  updateStats();
}

function updateStats(){
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-avail').textContent = items.filter(i=>!i.sold).length;
  document.getElementById('s-sold').textContent = items.filter(i=>i.sold).length;
}

function buy(id){
  fetch(`http://127.0.0.1:5000/items/${id}`, {
    method: "PUT"
  })
  .then(res => res.json())
  .then(updatedItem => {
    const index = items.findIndex(i => i.id === id);
    if(index !== -1){
      items[index] = updatedItem;
      render();
    }
  });
}

function openModal(){ document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

function addItem(){
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const student = document.getElementById('student').value;
  const faculty = document.getElementById('faculty').value;

  if(!name || !price || !student) return;

  const newItem = {
    name,
    price: parseFloat(price),
    student,
    faculty
  };

  fetch("http://127.0.0.1:5000/items", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(newItem)
  })
  .then(res => res.json())
  .then(data => {
    items.unshift(data);
    render();
    closeModal();
    // Clear inputs for next list execution
    document.getElementById('name').value = '';
    document.getElementById('price').value = '';
    document.getElementById('student').value = '';
  });
}

// Initial Core Boot Fetch Execution
fetch("http://127.0.0.1:5000/items")
  .then(res => res.json())
  .then(data => {
    items = data;
    render();
  });
</script>

</body>
</html>
