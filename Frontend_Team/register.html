<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Route // EcoLoop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <style>
        /* ==========================================================
           🌌 PREMIUM FOREST MATRIX THEME - REGISTRATION PIPELINE
           🎨 Palette: Obsidian Jade | Emerald Glow | Muted Crimson
           ✨ Engine: Hybrid JS/CSS Reactive Real-Time Typing Matrix
           ========================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto; 
            position: relative;
            background-color: #081111 !important; /* Deep obsidian jade base */
        }

        /* 🔥 BRAND-MATCHED RADIANT LIQUID BACKGROUND LAYER */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 85% 50%, rgba(16, 185, 129, 0.45) 0%, transparent 55%),
                        radial-gradient(circle at 15% 50%, rgba(31, 23, 38, 0.8) 0%, transparent 60%),
                        radial-gradient(circle at 50% 20%, rgba(5, 150, 105, 0.25) 0%, transparent 50%);
            background-size: 150% 150%;
            animation: liquidStreamOne 16s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 30% 80%, rgba(4, 120, 87, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 70% 20%, rgba(10, 20, 18, 0.7) 0%, transparent 55%);
            background-size: 150% 150%;
            animation: liquidStreamTwo 12s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        @keyframes liquidStreamOne { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes liquidStreamTwo { 0% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }

        /* 🌊 PRIMARY CONTAINER: Cyber Shield Matrix */
        .auth-container {
            background: rgba(11, 24, 23, 0.85) !important; /* Muted deep teal shield */
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75);
            text-align: center;
            z-index: 5;
            border: 1px solid rgba(16, 185, 129, 0.15); /* Soft emerald core ring */
            backdrop-filter: blur(20px); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 40px auto;
        }

        .auth-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 30px rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.4); 
        }

        .auth-header h2 {
            color: #ffffff !important; 
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .auth-header p {
            font-size: 0.85rem;
            margin-bottom: 30px;
            color: #10b981 !important; /* Sharp ecosystem emerald accent */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8 !important; 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #10b981;
            font-size: 18px;
            z-index: 6;
        }

        /* ⌨️ INPUT INTERFACE CONTROL BASE */
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: rgba(6, 13, 13, 0.8) !important; 
            border: 1px solid rgba(16, 185, 129, 0.2) !important;
            border-radius: 10px;
            color: #ffffff !important;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #10b981 !important; 
            background: rgba(6, 13, 13, 0.95) !important;
            box-shadow: 0 0 0 1px #10b981, 
                        0 0 12px rgba(16, 185, 129, 0.2);
        }

        .form-group:focus-within label {
            color: #10b981 !important;
            letter-spacing: 1.5px;
            transform: translateX(2px);
        }

        /* ✨ THE JAVASCRIPT-DRIVEN TYPING INTERACTIVE GLOW EFFECTS */
        .form-group input.typing-flash {
            border-color: #34d399 !important; 
            background: rgba(16, 185, 129, 0.08) !important;
            box-shadow: 0 0 0 2px #34d399, 
                        0 0 25px rgba(16, 185, 129, 0.6) !important; 
            transition: none !important; 
        }

        /* 🧱 MATCHED BUTTONS (Vibrant Crimson Red Contrast) */
        .btn-auth-submit {
            width: 100%;
            background: #dc2626 !important; /* Crimson red button */
            color: #ffffff !important;
            border: none;
            padding: 15px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-auth-submit:hover {
            background: #ef4444 !important; 
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #64748b !important;
            border-top: 1px solid rgba(16, 185, 129, 0.1);
            padding-top: 20px;
        }

        .auth-footer a {
            color: #34d399 !important; 
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .auth-footer a:hover { color: #10b981 !important; text-decoration: underline; }

        /* 🚨 PREMIUM FLOATING NODE BADGE */
        .status-node {
            position: absolute;
            top: 35px;
            left: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8 !important; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            z-index: 10 !important;
            text-decoration: none;
            background: rgba(11, 24, 23, 0.5);
            border: 1px solid rgba(16, 185, 129, 0.15);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .status-node:hover {
            color: #ffffff !important;
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981 !important;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }
    </style>
</head>
<body>

    <a href="/" class="status-node">
        <span class="status-dot"></span>
        <span class="status-text">REGISTRATION PIPELINE</span>
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Initialize Node</h2>
            <p>Establish profile within records</p>
        </div>
        
        <form id="regForm">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="ti ti-user"></i>
                    <input type="text" id="name" placeholder=" " required autocomplete="off">
                </div>
            </div>
            
            <div class="form-group">
                <label>Student ID Code</label>
                <div class="input-wrapper">
                    <i class="ti ti-numbers"></i>
                    <input type="text" id="student_id" placeholder="12111xxxxx" required autocomplete="off">
                </div>
            </div>
            
            <div class="form-group">
                <label>Academic Tier Level</label>
                <div class="input-wrapper">
                    <i class="ti ti-school"></i>
                    <select id="level">
                        <option value="Degree">Degree</option>
                        <option value="Diploma/Foundation">Diploma / Foundation</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>MMU Email Address</label>
                <div class="input-wrapper">
                    <i class="ti ti-mail"></i>
                    <input type="email" id="email" placeholder="username@student.mmu.edu.my" required autocomplete="off">
                </div>
            </div>
            
            <div class="form-group">
                <label>Master Password</label>
                <div class="input-wrapper">
                    <i class="ti ti-lock"></i>
                    <input type="password" id="password" placeholder=" " required>
                </div>
            </div>
            
            <button type="submit" class="btn-auth-submit">Register Profile</button>
        </form>
        
        <div class="auth-footer">
            Existing terminal asset? <a href="/login">Access login</a>
        </div>
    </div>

    <script>
        // Real-Time Alphanumeric Keyboard Reactive Flash Core Engine
        const inputs = document.querySelectorAll('.form-group input');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                input.classList.add('typing-flash');
                setTimeout(() => {
                    input.classList.remove('typing-flash');
                }, 45); // Quick 45ms lightning response window
            });
        });

        // Pipeline Submit: Registration request handler mapping to app.py
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value, 
                    student_id: document.getElementById('student_id').value,
                    level: document.getElementById('level').value, 
                    email: document.getElementById('email').value, 
                    password: document.getElementById('password').value
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) { 
                    alert(data.error); 
                } else { 
                    alert("Registration matrix updated successfully!"); 
                    window.location.href = '/login'; 
                }
            })
            .catch(err => {
                console.error("Registration fault:", err);
                alert("Failed to connect to registration server endpoint.");
            });
        });
    </script>
</body>
</html>
