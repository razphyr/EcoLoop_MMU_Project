
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account // EcoLoop</title>
    <link rel="stylesheet" href="register_style.css">
</head>
<body>

    <!-- Ambient orbs (same as login) -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Return Home node button -->
    <a href="/" class="node-return-btn">
        <span class="node-dot"></span>
        Node // Return Home
    </a>

    <div class="register-container">
        <div class="register-card">

            <!-- Corner accents -->
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>

            <div class="card-header">
                <div class="eco-badge">ECO<span>////</span>LOOP</div>
                <h2>Create Account</h2>
                <p class="subtitle">FCI Repositories Marketplace Network</p>
            </div>

            <div id="error-box" class="error-msg" style="display: none;"></div>

            <form id="registerForm">

                <!-- Full Name -->
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrap" id="wrap-name">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                </div>

                <!-- Student ID -->
                <div class="input-group">
                    <label for="student_id">Student ID</label>
                    <div class="input-wrap" id="wrap-student_id">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2z"/>
                        </svg>
                        <input type="text" id="student_id" required placeholder="1211101234">
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">MMU Student Email</label>
                    <div class="input-wrap" id="wrap-email">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="email" required placeholder="username@student.mmu.edu.my">
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Account Password</label>
                    <div class="input-wrap" id="wrap-password">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" required placeholder="••••••••">
                        <button type="button" class="toggle-pw" aria-label="Toggle password visibility" onclick="togglePassword()">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-register">Sign Up</button>
            </form>

            <div class="card-footer">
                <p>Already have an account? <a href="/login">Log In</a></p>
            </div>
        </div>
    </div>

    <script>
        // ── Typing flash + active glow ──────────────────────────
        const fields = document.querySelectorAll('.input-group input, .input-group select');

        fields.forEach(field => {
            const wrap = field.closest('.input-wrap');

            field.addEventListener('focus', () => wrap.classList.add('active'));
            field.addEventListener('blur',  () => {
                wrap.classList.remove('active');
                if (field.value) wrap.classList.add('filled');
                else             wrap.classList.remove('filled');
            });
            field.addEventListener('input', () => {
                wrap.classList.add('typing-flash');
                setTimeout(() => wrap.classList.remove('typing-flash'), 150);
            });
        });

        // ── Password toggle ─────────────────────────────────────
        function togglePassword() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }

        // ── Button ripple ────────────────────────────────────────
        document.querySelector('.btn-register').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top  = (e.clientY - rect.top)  + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        });

        // ── Form submission ──────────────────────────────────────
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            const payload = {
                name:       document.getElementById('name').value,
                student_id: document.getElementById('student_id').value,
                level:      "Degree", // Academic Level filter removed from UI; backend requires a non-null value
                email:      document.getElementById('email').value,
                password:   document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Registration successful! Redirecting to login...");
                    window.location.href = '/login';
                } else {
                    errorBox.textContent = result.error || "An error occurred during registration.";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = "Unable to connect to the authentication server.";
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
