<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLoop // Faculty Login</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <a href="/" class="status-node">
        <span class="status-dot"></span>
        Node // Return Home
    </a>

    <div class="auth-card">
        <h1 class="main-title">Portal Login</h1>
        <p class="subtitle">FCI Repositories Marketplace Network</p>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">MMU Email or Student ID</label>
                <input type="text" id="username" name="username" class="input-control" placeholder="ID or @student.mmu.edu.my" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Authorize Entry</button>
        </form>

        <div class="auth-footer">
            <p>Forgot credentials? <a href="/forgot-password">Configure 2FA Recovery</a></p>
            <p>New to the Hub? <a href="/register">Create Profile Node</a></p>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.input-control');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                // 1. Force the container to flash brightly by injecting a temporary CSS utility class
                input.classList.add('typing-flash');
                
                // 2. Remove it immediately after the transition wave completes so it can reset for the next letter
                setTimeout(() => {
                    input.classList.remove('typing-flash');
                }, 150);
            });
        });
    </script>
</body>
</html>
