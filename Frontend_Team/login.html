<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login // EcoLoop</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <a href="/" class="status-node">
        <span class="status-dot"></span>
        <span>NODE // RETURN HOME</span>
    </a>

    <div class="auth-card">
        <div class="card-header">
            <h2 class="main-title">Portal Login</h2>
            <p class="subtitle">FCI REPOSITORIES MARKETPLACE NETWORK</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">MMU Email or Student ID</label>
                <input id="username" class="input-control" name="username" type="text" placeholder="ID or @student.mmu.edu.my" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" class="input-control" name="password" type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">
                AUTHORIZE ENTRY
            </button>
        </form>

        <div class="auth-footer">
            <p>Forgot credentials? <a href="/forgot-password">Configure 2FA Recovery</a></p>
            <p>New to the Hub? <a href="/register">Create Profile Node</a></p>
        </div>
    </div>

    <script>
        // --- TEAMMATE'S GLASSMORPHISM INTERACTIVE MOTIONS ---
        const inputs = document.querySelectorAll('.input-control');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                input.classList.add('typing-flash');
                setTimeout(() => input.classList.remove('typing-flash'), 150);
            });
        });

        // Button ripple trigger engine
        const btn = document.querySelector('.btn-login');
        if (btn) {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = btn.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top  = (e.clientY - rect.top)  + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        }

        // --- AZFAR'S SECURE DATABASE SQL MAPPING LOOP ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameVal, password: passwordVal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { 
                    alert(data.error); 
                } else {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    if (data.user.role === 'admin') { window.location.href = '/admin'; } 
                    else { window.location.href = '/student'; }
                }
            })
            .catch(err => alert("Authentication node connection fault. Ensure app.py server is live."));
        });
    </script>
</body>
</html>
