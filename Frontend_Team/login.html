<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access // EcoLoop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <style>
        /* ==========================================================
           🌌 PREMIUM FOREST MATRIX THEME - ECOLOOP PORTAL
           🎨 Palette: Obsidian Jade | Emerald Glow | Muted Crimson
           ✨ Engine: Hybrid JS/CSS Reactive Real-Time Typing Matrix
           ========================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; 
            position: relative;
            background-color: #081111 !important; /* Deep obsidian jade base */
        }

        /* 🔥 BRAND-MATCHED RADIANT LIQUID BACKGROUND LAYER */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            /* Perfectly matches the vibrant green to dark gradient array from your splash image */
            background: radial-gradient(circle at 85% 50%, rgba(16, 185, 129, 0.45) 0%, transparent 55%),
                        radial-gradient(circle at 15% 50%, rgba(31, 23, 38, 0.8) 0%, transparent 60%),
                        radial-gradient(circle at 50% 20%, rgba(5, 150, 105, 0.25) 0%, transparent 50%);
            background-size: 150% 150%;
            animation: liquidStreamOne 16s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 30% 80%, rgba(4, 120, 87, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 70% 20%, rgba(10, 20, 18, 0.7) 0%, transparent 55%);
            background-size: 150% 150%;
            animation: liquidStreamTwo 12s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        @keyframes liquidStreamOne { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes liquidStreamTwo { 0% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }

        /* 🌊 PRIMARY CONTAINER: Cyber Shield Matrix */
        .auth-card {
            background: rgba(11, 24, 23, 0.85) !important; /* Muted deep teal shield */
            width: 100%;
            max-width: 410px;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75);
            text-align: center;
            z-index: 5;
            border: 1px solid rgba(16, 185, 129, 0.15); /* Soft emerald core ring */
            backdrop-filter: blur(20px); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 30px rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.4); 
        }

        .main-title {
            color: #ffffff !important; 
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.8rem;
            margin-bottom: 35px;
            color: #10b981 !important; /* Sharp ecosystem emerald accent */
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8 !important; 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        /* ⌨️ INPUT INTERFACE CONTROL BASE */
        .input-control {
            width: 100%;
            background: rgba(6, 13, 13, 0.8) !important; 
            border: 1px solid rgba(16, 185, 129, 0.2) !important;
            padding: 14px 16px;
            border-radius: 10px;
            color: #ffffff !important;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-control:focus {
            border-color: #10b981 !important; 
            background: rgba(6, 13, 13, 0.95) !important;
            box-shadow: 0 0 0 1px #10b981, 
                        0 0 12px rgba(16, 185, 129, 0.2);
        }

        .form-group:focus-within label {
            color: #10b981 !important;
            letter-spacing: 1.5px;
            transform: translateX(2px);
        }

        /* ✨ THE JAVASCRIPT-DRIVEN TYPING INTERACTIVE GLOW EFFECTS */
        .input-control.typing-flash {
            border-color: #34d399 !important; 
            background: rgba(16, 185, 129, 0.08) !important;
            box-shadow: 0 0 0 2px #34d399, 
                        0 0 25px rgba(16, 185, 129, 0.6) !important; 
            transition: none !important; 
        }

        .input-control:not(:placeholder-shown) {
            border-color: rgba(16, 185, 129, 0.4) !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.05);
        }

        /* 🧱 MATCHED BUTTONS (Vibrant Crimson Red Contrast) */
        .btn-login {
            width: 100%;
            background: #dc2626 !important; /* Clean crimson matching your landing search button */
            color: #ffffff !important;
            border: none;
            padding: 15px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: #ef4444 !important; 
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: #64748b !important;
            border-top: 1px solid rgba(16, 185, 129, 0.1);
            padding-top: 20px;
        }

        .auth-footer a {
            color: #34d399 !important; 
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .auth-footer a:hover { color: #10b981 !important; text-decoration: underline; }

        /* 🚨 PREMIUM FLOATING NODE BADGE */
        .status-node {
            position: absolute;
            top: 35px;
            left: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8 !important; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            z-index: 10 !important;
            text-decoration: none;
            background: rgba(11, 24, 23, 0.5);
            border: 1px solid rgba(16, 185, 129, 0.15);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .status-node:hover {
            color: #ffffff !important;
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981 !important;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }

        .status-dot::after {
            content: "";
            position: absolute;
            top: -4px; left: -4px; width: 16px; height: 16px;
            border: 2px solid #10b981;
            border-radius: 50%;
            opacity: 0;
            animation: nodepulse 2.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes nodepulse { 0% { transform: scale(0.6); opacity: 0.8; } 50% { opacity: 0.4; } 100% { transform: scale(1.5); opacity: 0; } }
        .floating-bg { display: none !important; }
    </style>
</head>
<body>

    <a href="/" class="status-node">
        <span class="status-dot"></span>
        <span class="status-text">FCI LIVE PORTAL ENVIRONMENT</span>
    </a>

    <div class="auth-card">
        <div class="main-title">EcoLoop</div>
        <div class="subtitle">The FCI Computing Marketplace Hub</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Email or Student ID</label>
                <input type="text" id="username" class="input-control" placeholder=" " required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Password Parameter</label>
                <input type="password" id="password" class="input-control" placeholder=" " required>
            </div>
            
            <div style="text-align: right; margin: -10px 0 25px 0;">
                <a href="/forgot-password" style="color: #34d399; font-size: 13px; text-decoration: none; font-weight: 600;">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-login">Initialize Session</button>
        </form>
        
        <div class="auth-footer">
            New member asset? <a href="/register">Create profile root</a>
        </div>
    </div>

    <script>
        // Real-Time Alphanumeric Keyboard Reactive Flash Core Engine
        const inputs = document.querySelectorAll('.input-control');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                input.classList.add('typing-flash');
                setTimeout(() => {
                    input.classList.remove('typing-flash');
                }, 45); // Quick 45ms lightning response window
            });
        });

        // Form Submit API Listener Sequence mapping to app.py
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameVal, password: passwordVal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { 
                    alert(data.error); 
                } else {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    // Check administrative clearance parameters
                    if (data.user.role === 'admin') { 
                        window.location.href = '/admin'; 
                    } else { 
                        window.location.href = '/student'; 
                    }
                }
            })
            .catch(err => {
                console.error("Transmission fault:", err);
                alert("Failed to reach authentication node.");
            });
        });
    </script>
</body>
</html>
