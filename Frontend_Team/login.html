<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLoop // Faculty Login</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <a href="/" class="status-node">
        <span class="status-dot"></span>
        Node // Return Home
    </a>

    <div class="auth-card">
        <h1 class="main-title">Portal Login</h1>
        <p class="subtitle">FCI Repositories Marketplace Network</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">MMU Email or Student ID</label>
                <input type="text" id="username" name="username" class="input-control" placeholder="ID or @student.mmu.edu.my" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Authorize Entry</button>
        </form>

        <div class="auth-footer">
            <p>Forgot credentials? <a href="/forgot-password">Configure 2FA Recovery</a></p>
            <p>New to the Hub? <a href="/register">Create Profile Node</a></p>
        </div>
    </div>

    <script>
        // Teammate's Reactive Real-Time Typing Transition Wave Mechanics
        const inputs = document.querySelectorAll('.input-control');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                input.classList.add('typing-flash');
                setTimeout(() => {
                    input.classList.remove('typing-flash');
                }, 150);
            });
        });

        // Your Secure Production Database Session Handler Mapping
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameVal, password: passwordVal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { 
                    alert(data.error); 
                } else {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // Route user nodes cleanly based on verified system permissions parameters
                    if (data.user.role === 'admin') { 
                        window.location.href = '/admin'; 
                    } else { 
                        window.location.href = '/student'; 
                    }
                }
            })
            .catch(err => {
                console.error("Authentication link fault:", err);
                alert("Failed to reach the database server node.");
            });
        });
    </script>
</body>
</html>
